spring:
  application:
    name: procar-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/procar-gateway}
    redis:
      uri: ${REDIS_URI:redis://localhost:6379}
    rabbitmq:
      host: ${RABBITMQ_HOST:localhost}
      port: ${RABBITMQ_PORT:5672}
      username: ${RABBITMQ_USERNAME:spring_app}
      password: ${RABBITMQ_PASSWORD:}

connector:
  auction-provider-procar-url: ${AUCTION_PROVIDER_PROCAR_URL:http://localhost:8083}
  auth-url: ${AUTH_URL:http://localhost:8082}
  user-url: ${USER_URL:http://localhost:8084}

storage:
  endpoint: ${STORAGE_ENDPOINT:https://nbg1.your-objectstorage.com}
  region: ${STORAGE_REGION:eu-central}
  bucket: ${STORAGE_BUCKET:procar-test}
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
