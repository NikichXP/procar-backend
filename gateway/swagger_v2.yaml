openapi: 3.0.1
info:
  title: Procar API
  description: Procar Backend API Documentation
  version: '1.0'
servers:
  - url: http://localhost:8080
    description: Local Development Server
tags:
  - name: Actuator
    description: Monitor and interact
    externalDocs:
      description: Spring Boot Actuator Web API Documentation
      url: https://docs.spring.io/spring-boot/docs/current/actuator-api/html/
paths:
  /users/me/watchlist/{lotId}:
    put:
      tags:
        - user-api
      operationId: addToWatchlist
      parameters:
        - name: lotId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
    delete:
      tags:
        - user-api
      operationId: removeFromWatchlist
      parameters:
        - name: lotId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
  /lots/{lotId}/bids:
    get:
      tags:
        - bid-api
      operationId: getBidHistory
      parameters:
        - name: lotId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BidPage'
    post:
      tags:
        - bid-api
      operationId: placeBid
      parameters:
        - name: lotId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BidRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Bid'
  /lots/{lotId}/bids/buyout:
    post:
      tags:
        - bid-api
      operationId: buyout
      parameters:
        - name: lotId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BuyoutResult'
        '409':
          description: Conflict - buyout not available or rejected
  /auth/register:
    post:
      tags:
        - auth-api
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AuthResult'
  /auth/logout:
    post:
      tags:
        - auth-api
      operationId: logout
      parameters:
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
  /auth/logout-all:
    post:
      tags:
        - auth-api
      operationId: logoutAllDevices
      parameters:
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: object
  /auth/login:
    post:
      tags:
        - auth-api
      operationId: login
      parameters:
        - name: username
          in: query
          required: false
          schema:
            type: string
        - name: password
          in: query
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AuthResult'
  /auth/access:
    post:
      tags:
        - auth-api
      operationId: refreshAccess
      parameters:
        - name: refreshToken
          in: query
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AccessToken'
  /users/me/watchlist:
    get:
      tags:
        - user-api
      operationId: getUserWatchlist
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LotSummary'
  /users/me/bids:
    get:
      tags:
        - user-api
      operationId: getUserBids
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - WINNING
              - OUTBID
              - WON
              - LOST
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserBidPage'
  /lots:
    get:
      tags:
        - lot-api
      operationId: getLots
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - UPCOMING
              - ACTIVE
              - FINISHED
              - CANCELLED
        - name: source
          in: query
          required: false
          schema:
            type: string
        - name: endsInMinutes
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: brandId
          in: query
          required: false
          schema:
            type: string
        - name: modelId
          in: query
          required: false
          schema:
            type: string
        - name: yearFrom
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: yearTo
          in: query
          required: false
          schema:
            type: integer
            format: int32
        - name: priceFrom
          in: query
          required: false
          schema:
            type: number
            format: double
        - name: priceTo
          in: query
          required: false
          schema:
            type: number
            format: double
        - name: condition
          in: query
          required: false
          schema:
            type: string
            enum:
              - NEW
              - USED
              - DAMAGED
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: endTime,asc
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LotPage'
  /lots/{lotId}:
    get:
      tags:
        - lot-api
      operationId: getLotDetail
      parameters:
        - name: lotId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LotDetail'
  /catalog/brand:
    get:
      tags:
        - car-catalog-api
      operationId: getBrands
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Brand'
  /catalog/brand/{brandId}/models:
    get:
      tags:
        - car-catalog-api
      operationId: getBrandModels
      parameters:
        - name: brandId
          in: path
          required: true
          schema:
            type: string
        - name: query
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Model'
components:
  schemas:
    AdminAuctionInfoRequest:
      required:
        - bidIncrement
        - currentBid
        - endTime
        - startTime
        - startingBid
      type: object
      properties:
        currentBid:
          type: number
          format: double
        startingBid:
          type: number
          format: double
        reservePrice:
          type: number
          format: double
        bidIncrement:
          type: number
          format: double
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        timeRemaining:
          type: integer
          format: int64
    AdminDamageInfoRequest:
      required:
        - area
        - description
        - severity
      type: object
      properties:
        area:
          type: string
        severity:
          type: string
          enum:
            - MINOR
            - MODERATE
            - MAJOR
            - SEVERE
        description:
          type: string
        estimatedRepairCost:
          type: number
          format: double
    AdminDocumentRequest:
      required:
        - type
        - url
      type: object
      properties:
        type:
          type: string
          enum:
            - TITLE
            - REGISTRATION
            - INSPECTION_REPORT
            - SERVICE_RECORDS
            - WARRANTY
            - OTHER
        url:
          type: string
        description:
          type: string
    AdminEngineInfoRequest:
      required:
        - type
      type: object
      properties:
        type:
          type: string
        displacement:
          type: number
          format: double
        cylinders:
          type: integer
          format: int32
        horsepower:
          type: integer
          format: int32
        torque:
          type: integer
          format: int32
    AdminFeeRequest:
      required:
        - amount
        - description
        - mandatory
        - type
      type: object
      properties:
        type:
          type: string
          enum:
            - BUYER_PREMIUM
            - DOCUMENTATION
            - SHIPPING
            - TAX
            - OTHER
        amount:
          type: number
          format: double
        description:
          type: string
        mandatory:
          type: boolean
    AdminInspectionInfoRequest:
      required:
        - inspected
        - keyFindings
      type: object
      properties:
        inspected:
          type: boolean
        inspectionDate:
          type: string
          format: date-time
        inspector:
          type: string
        reportUrl:
          type: string
        overallCondition:
          type: string
        keyFindings:
          type: array
          items:
            type: string
    AdminLocationInfoRequest:
      required:
        - address
        - city
        - country
        - state
        - timezone
        - zipCode
      type: object
      properties:
        address:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        country:
          type: string
        coordinates:
          $ref: '#/components/schemas/GeoCoordinates'
        timezone:
          type: string
    AdminLotMetadataRequest:
      required:
        - categories
        - fees
        - sellerInfo
        - tags
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
        categories:
          type: array
          items:
            type: string
        sellerInfo:
          $ref: '#/components/schemas/AdminSellerInfoRequest'
        inspection:
          $ref: '#/components/schemas/AdminInspectionInfoRequest'
        history:
          $ref: '#/components/schemas/AdminVehicleHistoryRequest'
        fees:
          type: array
          items:
            $ref: '#/components/schemas/AdminFeeRequest'
        shipping:
          $ref: '#/components/schemas/AdminShippingInfoRequest'
    AdminSellerInfoRequest:
      required:
        - id
        - name
        - type
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - DEALER
            - PRIVATE
            - AUCTION_HOUSE
            - LEASING_COMPANY
            - INSURANCE
        rating:
          type: number
          format: double
        totalSales:
          type: integer
          format: int32
        responseRate:
          type: number
          format: double
    AdminShippingInfoRequest:
      required:
        - available
        - methods
        - restrictions
      type: object
      properties:
        available:
          type: boolean
        estimatedCost:
          type: number
          format: double
        methods:
          type: array
          items:
            type: string
            enum:
              - PICKUP
              - DELIVERY
              - FREIGHT
              - WHITE_GLOVE
        restrictions:
          type: array
          items:
            type: string
    AdminUpdateLotRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        vehicle:
          $ref: '#/components/schemas/AdminVehicleInfoRequest'
        auction:
          $ref: '#/components/schemas/AdminAuctionInfoRequest'
        location:
          $ref: '#/components/schemas/AdminLocationInfoRequest'
        metadata:
          $ref: '#/components/schemas/AdminLotMetadataRequest'
        status:
          type: string
          enum:
            - DRAFT
            - UPCOMING
            - ACTIVE
            - ENDED
            - SOLD
            - UNSOLD
            - CANCELLED
            - SUSPENDED
        lotType:
          $ref: '#/components/schemas/LotType'
        buyoutPrice:
          type: number
          format: double
    AdminVehicleHistoryRequest:
      required:
        - accidents
        - owners
        - serviceRecords
        - titleStatus
      type: object
      properties:
        accidents:
          type: integer
          format: int32
        owners:
          type: integer
          format: int32
        titleStatus:
          type: string
          enum:
            - CLEAN
            - SALVAGE
            - REBUILT
            - FLOOD
            - LEMON
            - PARTS_ONLY
            - NONE
        serviceRecords:
          type: boolean
        lastServiceDate:
          type: string
          format: date-time
    AdminVehicleImageRequest:
      required:
        - isPrimary
        - type
        - url
      type: object
      properties:
        url:
          type: string
        type:
          type: string
          enum:
            - EXTERIOR
            - INTERIOR
            - ENGINE
            - TRUNK
            - DASHBOARD
            - DAMAGE
            - DOCUMENT
            - OTHER
        description:
          type: string
        isPrimary:
          type: boolean
    AdminVehicleInfoRequest:
      required:
        - bodyType
        - condition
        - documents
        - drivetrain
        - engine
        - features
        - fuelType
        - images
        - make
        - model
        - transmission
        - year
      type: object
      properties:
        vin:
          type: string
        make:
          type: string
        model:
          type: string
        year:
          type: integer
          format: int32
        trim:
          type: string
        bodyType:
          type: string
        color:
          type: string
        interiorColor:
          type: string
        mileage:
          type: integer
          format: int32
        engine:
          $ref: '#/components/schemas/AdminEngineInfoRequest'
        transmission:
          type: string
          enum:
            - AUTOMATIC
            - MANUAL
            - CVT
            - SEMI_AUTOMATIC
            - DUAL_CLUTCH
        drivetrain:
          type: string
          enum:
            - FWD
            - RWD
            - AWD
            - FOUR_WD
        fuelType:
          type: string
          enum:
            - GASOLINE
            - DIESEL
            - ELECTRIC
            - HYBRID
            - PLUGIN_HYBRID
            - FLEX_FUEL
            - OTHER
        condition:
          type: string
          enum:
            - EXCELLENT
            - GOOD
            - FAIR
            - POOR
            - DAMAGED
            - SALVAGE
        features:
          type: array
          items:
            type: string
        images:
          type: array
          items:
            $ref: '#/components/schemas/AdminVehicleImageRequest'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/AdminDocumentRequest'
        damage:
          type: array
          items:
            $ref: '#/components/schemas/AdminDamageInfoRequest'
    GeoCoordinates:
      required:
        - latitude
        - longitude
      type: object
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
    AdminAuctionInfoResponse:
      required:
        - bidIncrement
        - currentBid
        - endTime
        - startTime
        - startingBid
        - totalBids
      type: object
      properties:
        currentBid:
          type: number
          format: double
        startingBid:
          type: number
          format: double
        reservePrice:
          type: number
          format: double
        bidIncrement:
          type: number
          format: double
        totalBids:
          type: integer
          format: int32
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        timeRemaining:
          type: integer
          format: int64
    AdminDamageInfoResponse:
      required:
        - area
        - description
        - severity
      type: object
      properties:
        area:
          type: string
        severity:
          type: string
          enum:
            - MINOR
            - MODERATE
            - MAJOR
            - SEVERE
        description:
          type: string
        estimatedRepairCost:
          type: number
          format: double
    AdminDocumentResponse:
      required:
        - type
        - url
      type: object
      properties:
        type:
          type: string
          enum:
            - TITLE
            - REGISTRATION
            - INSPECTION_REPORT
            - SERVICE_RECORDS
            - WARRANTY
            - OTHER
        url:
          type: string
        description:
          type: string
    AdminEngineInfoResponse:
      required:
        - type
      type: object
      properties:
        type:
          type: string
        displacement:
          type: number
          format: double
        cylinders:
          type: integer
          format: int32
        horsepower:
          type: integer
          format: int32
        torque:
          type: integer
          format: int32
    AdminFeeResponse:
      required:
        - amount
        - description
        - mandatory
        - type
      type: object
      properties:
        type:
          type: string
          enum:
            - BUYER_PREMIUM
            - DOCUMENTATION
            - SHIPPING
            - TAX
            - OTHER
        amount:
          type: number
          format: double
        description:
          type: string
        mandatory:
          type: boolean
    AdminInspectionInfoResponse:
      required:
        - inspected
        - keyFindings
      type: object
      properties:
        inspected:
          type: boolean
        inspectionDate:
          type: string
          format: date-time
        inspector:
          type: string
        reportUrl:
          type: string
        overallCondition:
          type: string
        keyFindings:
          type: array
          items:
            type: string
    AdminLocationInfoResponse:
      required:
        - address
        - city
        - country
        - state
        - timezone
        - zipCode
      type: object
      properties:
        address:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        country:
          type: string
        coordinates:
          $ref: '#/components/schemas/GeoCoordinates'
        timezone:
          type: string
    AdminLotMetadataResponse:
      required:
        - categories
        - fees
        - sellerInfo
        - tags
      type: object
      properties:
        tags:
          type: array
          items:
            type: string
        categories:
          type: array
          items:
            type: string
        sellerInfo:
          $ref: '#/components/schemas/AdminSellerInfoResponse'
        inspection:
          $ref: '#/components/schemas/AdminInspectionInfoResponse'
        history:
          $ref: '#/components/schemas/AdminVehicleHistoryResponse'
        fees:
          type: array
          items:
            $ref: '#/components/schemas/AdminFeeResponse'
        shipping:
          $ref: '#/components/schemas/AdminShippingInfoResponse'
    AdminLotResponse:
      required:
        - createdAt
        - description
        - externalId
        - id
        - location
        - metadata
        - status
        - title
        - updatedAt
        - vehicle
      type: object
      properties:
        id:
          type: string
        externalId:
          type: string
        title:
          type: string
        description:
          type: string
        vehicle:
          $ref: '#/components/schemas/AdminVehicleInfoResponse'
        auction:
          $ref: '#/components/schemas/AdminAuctionInfoResponse'
        location:
          $ref: '#/components/schemas/AdminLocationInfoResponse'
        metadata:
          $ref: '#/components/schemas/AdminLotMetadataResponse'
        status:
          type: string
          enum:
            - DRAFT
            - UPCOMING
            - ACTIVE
            - ENDED
            - SOLD
            - UNSOLD
            - CANCELLED
            - SUSPENDED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lotType:
          $ref: '#/components/schemas/LotType'
        buyoutPrice:
          type: number
          format: double
    AdminSellerInfoResponse:
      required:
        - id
        - name
        - type
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - DEALER
            - PRIVATE
            - AUCTION_HOUSE
            - LEASING_COMPANY
            - INSURANCE
        rating:
          type: number
