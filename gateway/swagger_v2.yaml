        restrictions:
          type: array
          items:
            type: string
    AdminVehicleHistoryResponse:
      required:
        - accidents
        - owners
        - serviceRecords
        - titleStatus
      type: object
      properties:
        accidents:
          type: integer
          format: int32
        owners:
          type: integer
          format: int32
        titleStatus:
          type: string
          enum:
            - CLEAN
            - SALVAGE
            - REBUILT
            - FLOOD
            - LEMON
            - PARTS_ONLY
            - NONE
        serviceRecords:
          type: boolean
        lastServiceDate:
          type: string
          format: date-time
    AdminVehicleImageResponse:
      required:
        - isPrimary
        - type
        - url
      type: object
      properties:
        url:
          type: string
        type:
          type: string
          enum:
            - EXTERIOR
            - INTERIOR
            - ENGINE
            - TRUNK
            - DASHBOARD
            - DAMAGE
            - DOCUMENT
            - OTHER
        description:
          type: string
        isPrimary:
          type: boolean
    AdminVehicleInfoResponse:
      required:
        - bodyType
        - condition
        - documents
        - drivetrain
        - engine
        - features
        - fuelType
        - images
        - make
        - model
        - transmission
        - year
      type: object
      properties:
        vin:
          type: string
        make:
          type: string
        model:
          type: string
        year:
          type: integer
          format: int32
        trim:
          type: string
        bodyType:
          type: string
        color:
          type: string
        interiorColor:
          type: string
        mileage:
          type: integer
          format: int32
        engine:
          $ref: '#/components/schemas/AdminEngineInfoResponse'
        transmission:
          type: string
          enum:
            - AUTOMATIC
            - MANUAL
            - CVT
            - SEMI_AUTOMATIC
            - DUAL_CLUTCH
        drivetrain:
          type: string
          enum:
            - FWD
            - RWD
