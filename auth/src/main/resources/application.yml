spring:
  application:
    name: auth-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/procar-auth

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
