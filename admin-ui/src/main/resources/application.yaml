server:
  port: 8888

spring:
  application:
    name: admin-ui
  
  security:
    user:
      name: admin
      password: admin
      roles: ADMIN

# Gateway configuration
gateway:
  base-url: http://localhost:8080

# Vaadin configuration
vaadin:
  frontend:
    directory: src/main/resources/frontend
    output-directory: generated/frontend

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr([%thread]){blue} %clr(%-5level){cyan} %clr(%logger{36}){magenta} - %msg%n"
  level:
    com.procar.admin: DEBUG
    org.springframework.security: INFO
