spring:
  application:
    name: user-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/procar-user}
      database: procar-user
    rabbitmq:
      host: ${RABBITMQ_HOST:localhost}
      port: ${RABBITMQ_PORT:5672}
      username: ${RABBITMQ_USERNAME:spring_app}
      password: ${RABBITMQ_PASSWORD:}

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.procar.user: DEBUG
    org.springframework.data.mongodb: DEBUG
