name: Build and Deploy

on:
  push:
    branches: [main, ui]
  workflow_dispatch:

concurrency:
  group: build-deploy
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.REGISTRY_URL }}
  IMAGE_PREFIX: ${{ vars.REGISTRY_URL }}/${{ vars.IMAGE_NAMESPACE }}
  NAMESPACE: procar

jobs:
  setup:
    runs-on: self-hosted
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      services: ${{ steps.set-matrix.outputs.services }}
    steps:
      - id: set-matrix
        shell: bash
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo 'matrix={"include":[{"name":"gateway","dockerfile":"gateway/Dockerfile"},{"name":"auth","dockerfile":"auth/Dockerfile"},{"name":"user","dockerfile":"user/Dockerfile"},{"name":"auction-provider-procar","dockerfile":"auction-provider-procar/Dockerfile"}]}' >> $GITHUB_OUTPUT
            echo 'services=gateway auth user auction-provider-procar' >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "ui" ]]; then
            echo 'matrix={"include":[{"name":"admin-jetpack","dockerfile":"admin-jetpack/Dockerfile"}]}' >> $GITHUB_OUTPUT
            echo 'services=admin-jetpack' >> $GITHUB_OUTPUT
          else
            # Default to main services for workflow_dispatch on other branches if needed, or empty
            echo 'matrix={"include":[{"name":"gateway","dockerfile":"gateway/Dockerfile"},{"name":"auth","dockerfile":"auth/Dockerfile"},{"name":"user","dockerfile":"user/Dockerfile"},{"name":"auction-provider-procar","dockerfile":"auction-provider-procar/Dockerfile"}]}' >> $GITHUB_OUTPUT
            echo 'services=gateway auth user auction-provider-procar' >> $GITHUB_OUTPUT
          fi

  build:
    needs: [setup]
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=min,scope=${{ matrix.name }}
          provenance: false
        timeout-minutes: 30

      - name: Retry build and push ${{ matrix.name }}
        if: failure()
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=min,scope=${{ matrix.name }}
          provenance: false
        timeout-minutes: 30

  deploy:
    runs-on: self-hosted
    needs: [setup, build]
    env:
      KUBECONFIG: ${{ github.workspace }}/.kube/config
      IMAGE_TAG: ${{ github.sha }}
      SERVICES: ${{ needs.setup.outputs.services }}
    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Write kubeconfig
        shell: bash
        run: |
          mkdir -p "$(dirname "$KUBECONFIG")"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          kubectl --namespace "$NAMESPACE" get deploy

      - name: Roll out new images
        shell: bash
        run: |
          set -euo pipefail
          for svc in $SERVICES; do
            kubectl -n "$NAMESPACE" set image "deployment/$svc" \
              "$svc=$IMAGE_PREFIX/$svc:$IMAGE_TAG" --record=false
          done

      - name: Wait for rollouts
        shell: bash
        run: |
          set -euo pipefail
          for svc in $SERVICES; do
            kubectl -n "$NAMESPACE" rollout status "deployment/$svc" --timeout=300s
          done

      - name: Cleanup kubeconfig
        if: always()
        shell: bash
        run: rm -f "$KUBECONFIG"
