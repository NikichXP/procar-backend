apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: procar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: registry.pc-dev.nikichxp.xyz/procar/gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: REDIS_URI
              value: redis://redis:6379
            - name: AUCTION_PROVIDER_PROCAR_URL
              value: http://auction-provider-procar:8083
            - name: AUTH_URL
              value: http://auth:8082
            - name: USER_URL
              value: http://user:8084
            - name: MONGO_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: mongodb-config
                  key: MONGO_USERNAME
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_PASSWORD
            - name: MONGO_HOST
              valueFrom:
                configMapKeyRef:
                  name: mongodb-config
                  key: MONGO_HOST
            - name: MONGO_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: mongodb-config
                  key: MONGO_DATABASE
            - name: MONGO_APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: mongodb-config
                  key: MONGO_APP_NAME
            - name: MONGODB_URI
              value: "mongodb+srv://$(MONGO_USERNAME):$(MONGO_PASSWORD)@$(MONGO_HOST)/$(MONGO_DATABASE)?appName=$(MONGO_APP_NAME)"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30

---

apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: procar
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
